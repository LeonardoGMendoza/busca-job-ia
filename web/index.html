<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BuscaJob IA · Trabalho para estudantes na fronteira e home office</title>
<meta name="description" content="Compare as casas de câmbio de Ciudad del Este e Foz do Iguaçu e veja qual paga mais hoje.">
<meta name="theme-color" content="#0b2545">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800;900&display=swap">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
} }
</script>
<style>
:root{--bg:#f2f5f9;--card:#fff;--ink:#0b2545;--muted:#5d6b7e;--line:#dde3eb;--brand:#0f8b5f;--brand-ink:#fff;--gold:#f4b400;--ad:#fff8e1;--ad-line:#f0d27a;--font:"Nunito Sans","Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45}
button,input,select{font:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
header{background:var(--ink);color:#fff;padding:12px 16px}
.topo{margin:0 auto;display:flex;align-items:center;gap:12px}
.marca{font-weight:900;font-size:20px;display:flex;align-items:center;gap:8px}
.marca .logo{width:32px;height:32px;border-radius:9px;background:var(--brand);display:grid;place-items:center;font-size:18px}
.espaco{flex:1}
.idiomas{display:flex;background:rgba(255,255,255,.12);border-radius:999px;padding:3px}
.idiomas button{border:0;background:transparent;color:#fff;font-weight:800;padding:6px 11px;border-radius:999px;min-height:36px}
.idiomas button[aria-pressed="true"]{background:#fff;color:var(--ink)}
.busca{background:var(--card);border-radius:18px;box-shadow:0 10px 26px rgba(11,37,69,.12);border:1px solid var(--line);padding:14px;display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end}
.busca label.v{grid-column:1 / -1}
.busca label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.busca input,.busca select{border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;min-height:48px;color:var(--ink);font-weight:800;font-size:18px;background:#fff;width:100%}
.inverter{border:1.5px solid var(--line);background:#fff;border-radius:50%;width:48px;height:48px;font-size:20px;font-weight:900}
.cidades{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 6px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-weight:800;min-height:40px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.aviso{background:#fdecea;border:1px solid #f5c2bd;color:#8a2a1f;border-radius:12px;padding:10px 12px;font-weight:700;font-size:14px;margin:10px 0}
.info{font-size:13px;color:var(--muted);margin:6px 2px 10px}
.anuncio{display:flex;gap:12px;align-items:center;background:var(--ad);border:1.5px solid var(--ad-line);border-radius:16px;padding:12px 14px;margin:10px 0;text-decoration:none;color:var(--ink)}
.anuncio .tag{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;background:var(--gold);color:#3b2a00;border-radius:6px;padding:2px 7px}
.anuncio b{display:block;font-size:16px}
.anuncio span.txt{font-size:14px;color:var(--muted)}
.lista{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.casa{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px;display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center}
.casa.melhor{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand) inset}
.pos{width:40px;height:40px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-weight:900;font-size:18px}
.casa.melhor .pos{background:var(--brand);color:#fff}
.nome{font-weight:900;font-size:17px}
.onde{font-size:13px;color:var(--muted)}
.selos{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.selo{font-size:11px;font-weight:900;border-radius:6px;padding:2px 7px;text-transform:uppercase;letter-spacing:.4px}
.selo.top{background:#e3f5ec;color:var(--brand)}
.selo.parc{background:#e8eefc;color:#2a4cb0}
.valor{text-align:right}
.valor .recebe{font-weight:900;font-size:20px;white-space:nowrap}
.valor .taxa{font-size:12px;color:var(--muted)}
.valor .mais{font-size:13px;font-weight:800;color:var(--brand)}
.acoes{grid-column:2 / -1;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:8px 12px;font-weight:800;min-height:42px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.prim{background:var(--brand);border-color:var(--brand);color:#fff}
.vazio{background:var(--card);border-radius:16px;padding:20px;text-align:center;color:var(--muted)}
.ia{background:var(--card);border-radius:18px;border:1.5px solid var(--line);padding:16px;margin-top:22px}
.ia h2{margin:0 0 4px;font-size:19px}
.ia p.sub{margin:0 0 12px;color:var(--muted);font-size:14px}
.conversa{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.msg{max-width:88%;padding:10px 12px;border-radius:14px}
.msg.eu{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--bg);border-bottom-left-radius:4px}
form.perg{display:flex;gap:8px}
form.perg input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;min-height:48px}
.mic{width:48px;height:48px;border-radius:50%;border:0;background:var(--brand);color:#fff;font-size:20px;flex:none}
.mic[data-ouvindo="1"]{background:#e3762b;animation:pulsa 1.2s infinite}
@keyframes pulsa{0%,100%{box-shadow:0 0 0 0 rgba(227,118,43,.5)}50%{box-shadow:0 0 0 12px rgba(227,118,43,0)}}
footer{max-width:960px;margin:0 auto;padding:0 16px 40px;font-size:13px;color:var(--muted)}
footer a{color:inherit}
@media (max-width:720px){
  .casa{grid-template-columns:36px 1fr}
  .valor{grid-column:2;text-align:left}
  .pos{width:34px;height:34px;font-size:16px}
}
@media (prefers-reduced-motion:reduce){.mic[data-ouvindo="1"]{animation:none}}

.palco #avatar{position:absolute;inset:0}
.palco .status{position:absolute;left:0;right:0;top:45%;text-align:center;font-weight:800;font-size:14px;opacity:.85}
.balao{position:absolute;left:10px;right:10px;bottom:10px;background:#fff;color:var(--ink);border-radius:14px;padding:8px 11px;font-size:13px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.25);max-height:45%;overflow:auto}
.balao:empty{display:none}
.comecar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);border:0;border-radius:999px;background:var(--brand);color:#fff;font-weight:900;padding:12px 20px;box-shadow:0 8px 22px rgba(0,0,0,.3);white-space:nowrap}
.comecar[hidden]{display:none}
.titulo-sec{font-size:17px;font-weight:900;margin:22px 2px 10px}
.carrossel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 8px;scrollbar-width:none}
.carrossel::-webkit-scrollbar{display:none}
.parceiro{flex:0 0 min(280px,82%);scroll-snap-align:start;display:flex;gap:12px;align-items:center;border-radius:16px;padding:12px 14px;text-decoration:none;color:var(--ink);border:1.5px solid}
.parceiro .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:22px;flex:none}
.parceiro b{display:block;font-size:15px}
.parceiro small{color:var(--muted);font-size:13px}
.parceiro .tag{display:inline-block;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:2px}
.promos{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.promo{flex:0 0 min(320px,82%);height:170px;border-radius:18px;position:relative;overflow:hidden;color:#fff;text-decoration:none;background-size:cover;background-position:center;box-shadow:0 8px 20px rgba(11,37,69,.18)}
.promo::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.72),rgba(0,0,0,.15))}
.promo>*{position:relative}
.promo .selo-p{position:absolute;left:16px;top:16px;font-weight:900;font-size:13px;border-radius:6px;padding:3px 8px}
.promo b{position:absolute;left:16px;top:52px;font-size:22px;line-height:1.15;font-weight:900;max-width:70%}
.promo span.cta{position:absolute;left:16px;bottom:16px;font-weight:900}

.app{display:grid;grid-template-columns:minmax(320px,44%) 1fr;height:calc(100vh - 60px);height:calc(100dvh - 60px)}
.palco{position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,#dfe7f0,#c3d0de)}
.palco #avatar{position:absolute;inset:0}
.palco .status{position:absolute;left:0;right:0;top:45%;text-align:center;font-weight:800;color:var(--muted)}
.balao{bottom:120px;left:16px;right:16px;max-height:30%}
.comecar{bottom:130px}
.voz{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:5}
.palco .mic{width:78px;height:78px;font-size:32px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.dica-voz{font-size:13px;font-weight:800;background:rgba(255,255,255,.9);border-radius:999px;padding:3px 10px}
.painel{overflow:auto;padding:22px 26px 40px}
.painel h1{font-size:26px;font-weight:900;margin:0 0 4px;line-height:1.2}
.painel .sub{margin:0 0 16px;color:var(--muted)}
.painel footer{padding:20px 0 0}
@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:46vh auto;height:auto}
  .palco{height:46vh;position:sticky;top:0;z-index:3}
  .balao{bottom:118px;font-size:12px}
  .comecar{bottom:122px}
  .palco .mic{width:62px;height:62px;font-size:26px}
  .painel{padding:16px}
  .painel h1{font-size:21px}
}

.grupo{margin:14px 0 6px}
.grupo h3{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:0 0 8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.pais{font-size:12px;font-weight:900;color:var(--muted);margin:8px 0 4px}
.areas{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.area{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:10px;text-align:left;font-weight:800;display:flex;gap:8px;align-items:center;min-height:52px}
.area .ic{font-size:22px}
.area[aria-pressed="true"]{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand) inset;background:#effaf5}
.resumo{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px;margin:16px 0 10px}
.resumo b{font-size:17px}
.sites{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:12px}
.site{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;text-decoration:none;color:var(--ink);font-weight:900;background:#fff}
.site:hover{border-color:var(--brand)}
.site small{display:block;font-weight:600;color:var(--muted);font-size:12px}
.dica{background:#eef6ff;border:1px solid #cfe2ff;border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0}
.vaga{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.vaga b{display:block}
.vaga small{color:var(--muted)}
.lista-vagas{display:grid;gap:8px}
</style>
</head>
<body>
<header><div class="topo">
  <div class="marca"><span class="logo" aria-hidden="true">💼</span>BuscaJob IA</div>
  <div class="espaco"></div>
  <div class="idiomas" role="group" aria-label="Idioma">
    <button type="button" data-lang="pt">PT</button><button type="button" data-lang="es">ES</button><button type="button" data-lang="en">EN</button>
  </div>
</div></header>
<div class="app">
  <section class="palco" id="palco" aria-label="Atendente 3D">
    <div id="avatar"></div><div class="status" id="status"></div>
    <div class="balao" id="balao" aria-live="polite"></div>
    <button type="button" class="comecar" id="comecar"></button>
    <div class="voz"><button type="button" class="mic" id="mic">🎤</button><div class="dica-voz" id="dicaVoz"></div></div>
  </section>
  <section class="painel">
    <h1 id="titulo"></h1><p class="sub" id="subtitulo"></p>
    <main id="app"></main>
    <footer id="rodape"></footer>
  </section>
</div>
<script type="module" src="./src/app.js?v=2"></script>
</body>
</html>

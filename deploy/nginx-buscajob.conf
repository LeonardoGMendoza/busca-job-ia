# /etc/nginx/sites-available/buscajob  (ln -s para sites-enabled)
# buscajob.sandlj.com.br: o site (pasta web/, a mesma do GitHub Pages) e a API em /api/ no mesmo endereço.
server {
    listen 80;
    server_name buscajob.sandlj.com.br;

    root /opt/busca-job-ia/web;
    index index.html;

    # API (Docker em 127.0.0.1:8070)
    location /api/ {
        proxy_pass http://127.0.0.1:8070;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Avatares 3D (pesados): o navegador guarda por 30 dias
    location /assistente/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
    location /avatars/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Telas: sempre a versão mais nova (main.js e main.css não têm hash no nome)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
